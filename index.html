<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>The Watchlist — 238 films</title>
<meta name="description" content="A simple local checklist for 238 films. Progress saves in your browser.">
<meta name="color-scheme" content="dark light">
<style>
  :root{
    --bg:#0b0b0b;
    --fg:#cfcfcf;
    --dim:#7c7c7c;
    --faint:#565656;
    --acc:#991d1d;
    --acc-dim:#5e1414;
    --line:#232323;
    --line2:#343434;
    --sel:#141414;
    --pickbg:#1a0c0c;
    --ctl:26px;
    --mono:"Cascadia Mono","Cascadia Code",Consolas,"SF Mono",Menlo,ui-monospace,monospace;
  }
  :root[data-theme="light"]{
    --bg:#f2f0ea;
    --fg:#1c1c1c;
    --dim:#5c5c5c;
    --faint:#8b8880;
    --acc:#1d7896;
    --acc-dim:#1a5f77;
    --line:#dad6cd;
    --line2:#c5c0b5;
    --sel:#e9e5dd;
    --pickbg:#e2eef4;
  }
  *,*::before,*::after{box-sizing:border-box}
  html{scroll-behavior:smooth;scroll-padding-top:20px}
  @media(prefers-reduced-motion:reduce){html{scroll-behavior:auto}*{transition:none!important}}
  body{
    margin:0;background:var(--bg);color:var(--fg);
    font:400 13px/1.5 var(--mono);
    -webkit-font-smoothing:antialiased;
  }
  a{color:var(--acc);text-decoration:none}
  a:hover{text-decoration:underline}
  button,input,select{font:inherit;color:inherit;background:none;border:0;border-radius:0;appearance:none}
  :focus-visible{outline:1px solid var(--acc);outline-offset:2px}
  ::selection{background:var(--acc);color:var(--bg)}
  .wrap{width:min(1040px,calc(100% - 32px));margin-inline:auto}
  .skip{position:absolute;left:-9999px;top:0}
  .skip:focus{left:8px;top:8px;background:var(--acc);color:var(--bg);padding:4px 8px;z-index:99}

  /* hero */
  .hero{border-bottom:1px solid var(--line);padding:28px 0 18px}
  .hero__row{display:flex;align-items:center;gap:14px;flex-wrap:wrap}
  .hero__lead{display:flex;flex-direction:column;align-items:flex-start;gap:10px;min-width:0}
  .hero h1{font:700 clamp(19px,3vw,25px)/1.15 var(--mono);letter-spacing:.18em;text-transform:uppercase;margin:0;color:var(--fg)}
  .hero h1 em{font-style:normal;color:var(--acc)}
  .progress{width:300px;max-width:100%;margin-left:auto}
  .progress__num{color:var(--dim);font-size:11px;letter-spacing:.06em;line-height:1;margin-bottom:8px}
  .progress__num b{color:var(--fg);font-size:16px;font-weight:700}
  .progress__bar{height:10px;border:1px solid var(--line2);overflow:hidden}
  .progress__bar i{
    display:block;height:100%;width:0;
    background:repeating-linear-gradient(90deg,var(--acc) 0 5px,transparent 5px 8px);
    transition:width .2s linear;
  }
  .progress__note{margin:7px 0 0;color:var(--faint);font-size:11px;letter-spacing:.04em}
  .progress__note b{color:var(--acc);font-weight:400}

  /* randomizer */
  .pick{display:flex;align-items:center;gap:10px 16px;flex-wrap:wrap}
  .pick__btn{
    display:inline-flex;align-items:center;height:var(--ctl);padding:0 10px;
    border:1px solid var(--line2);color:var(--fg);cursor:pointer;
    font-size:11px;letter-spacing:.08em;text-transform:uppercase;transition:.12s;
  }
  .pick__btn:hover{background:var(--acc);border-color:var(--acc);color:var(--bg)}
  .pick__btn i{display:none}
  .pick__out{margin:0;color:var(--faint);font-size:11.5px}
  .pick__link{color:var(--acc);border-bottom:1px solid var(--acc-dim)}
  .pick__link:hover{text-decoration:none;border-color:var(--acc)}

  /* controls */
  .controls{display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding:11px 0;border-bottom:1px solid var(--line)}
  .seg{display:flex;gap:4px}
  .btn{
    display:inline-flex;align-items:center;height:var(--ctl);padding:0 8px;
    border:1px solid transparent;color:var(--dim);cursor:pointer;
    font-size:11px;letter-spacing:.06em;text-transform:uppercase;transition:.12s;
  }
  .btn:hover{color:var(--fg);border-color:var(--line2)}
  .btn[aria-pressed="true"]{color:var(--acc);border-color:var(--acc-dim)}
  #viewBtn,#themeBtn{border-color:var(--line2)}
  #viewBtn:hover,#themeBtn:hover{border-color:var(--acc-dim)}
  .controls__sp{flex:1}
  .search{position:relative;flex:1 1 210px;min-width:150px;height:var(--ctl);display:flex;align-items:center;gap:6px;border:1px solid var(--line2);padding:0 6px}
  .search:focus-within{border-color:var(--acc-dim)}
  .search::before{content:">";color:var(--acc);font-size:12px;line-height:1}
  .search input{flex:1;height:100%;padding:0;font-size:12px;line-height:1;color:var(--fg)}
  .search input:focus-visible{outline:none}
  .search input::placeholder{color:var(--faint)}
  .search kbd{display:none}
  .select{display:inline-flex;align-items:center;height:var(--ctl);border:1px solid var(--line2);padding:0 6px;font-size:11px;line-height:1;color:var(--dim);cursor:pointer}
  .select:hover{color:var(--fg);border-color:var(--acc-dim)}
  @media(max-width:720px){
    .controls__sp{display:none}
    .search{flex:1 1 100%;order:-1}
    .progress{width:100%;margin-left:0}
  }

  /* list */
  .films{list-style:none;margin:0;padding:0}
  .film{display:flex;align-items:stretch;border-bottom:1px solid var(--line)}
  .film[hidden]{display:none}
  .film:hover{background:var(--sel)}
  .film__check{position:absolute;opacity:0;width:1px;height:1px;pointer-events:none}
  .film__boxlabel{display:flex;align-items:flex-start;padding:5px 7px 5px 2px;cursor:pointer;flex:0 0 auto}
  .film__box{color:var(--faint);font-size:12.5px;line-height:1.5;white-space:nowrap;transition:.12s}
  .film__box::before{content:"[ ]"}
  .film.is-watched .film__box{color:var(--acc)}
  .film.is-watched .film__box::before{content:"[x]"}
  .film__boxlabel:hover .film__box{color:var(--fg)}
  .film__check:focus-visible ~ .film__boxlabel .film__box{outline:1px dashed var(--acc);outline-offset:2px}
  .film__main{flex:1;display:grid;grid-template-columns:1fr auto;gap:12px;align-items:start;padding:5px 4px 5px 0;min-width:0}
  .film__open,.film__name{
    max-width:100%;display:flex;gap:10px;align-items:baseline;flex-wrap:wrap;text-align:left;
  }
  .film__open{justify-self:start;padding:0;background:none;cursor:pointer}
  .film__open:hover .film__title{color:var(--acc)}
  .film.is-watched .film__open:hover .film__title{color:var(--faint)}
  .film__title{color:var(--fg);overflow-wrap:anywhere}
  .film__uk{color:var(--faint);font-size:11.5px;overflow-wrap:anywhere}
  .film__sub{color:var(--dim);font-size:11.5px;white-space:nowrap;text-align:right;font-variant-numeric:tabular-nums}
  .film__sub i{color:var(--faint);font-style:normal}
  .film__sub b{color:var(--dim);font-weight:400}
  .film__link{
    display:grid;place-items:center;width:30px;color:var(--faint);font-size:12px;
    border-left:1px solid var(--line);flex:0 0 auto;
  }
  .film__link:hover{color:var(--acc);text-decoration:none;background:var(--sel)}
  .film.is-watched .film__title{color:var(--faint);text-decoration:line-through}
  .film.is-watched .film__uk{opacity:.45}
  .film.is-picked{background:var(--pickbg);box-shadow:inset 2px 0 0 var(--acc)}
  .film.is-picked .film__title{color:var(--acc)}
  @media(max-width:720px){
    .film__main{grid-template-columns:1fr;padding:6px 4px 6px 0}
    .film__sub{grid-column:1;text-align:left;white-space:normal}
  }

  /* grid view */
  .films.is-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:22px 14px;padding:16px 0}
  .films.is-grid .film{position:relative;display:flex;flex-direction:column;gap:8px;border:0}
  .films.is-grid .film[hidden]{display:none}
  .films.is-grid .film:hover{background:none}
  .films.is-grid .film__poster{
    display:block;width:100%;aspect-ratio:2/3;background:var(--sel);
    border:1px solid var(--line2);overflow:hidden;
  }
  .films.is-grid .film__poster img{display:block;width:100%;height:100%;object-fit:cover}
  .films.is-grid .film:hover .film__poster{border-color:var(--acc-dim)}
  .films.is-grid .film.is-watched .film__poster img{filter:grayscale(1);opacity:.45}
  .films.is-grid .film__boxlabel{position:absolute;top:6px;left:6px;z-index:2;background:var(--bg);padding:0 3px}
  .films.is-grid .film__box{color:var(--fg);font-size:11px;line-height:1.4}
  .films.is-grid .film.is-watched .film__box{color:var(--acc)}
  .films.is-grid .film__main{display:flex;flex-direction:column;gap:2px;padding:0;flex:none}
  .films.is-grid .film__name{flex-direction:column;gap:1px}
  .films.is-grid .film__title{font-size:12px;line-height:1.3}
  .films.is-grid .film__uk{font-size:10.5px;line-height:1.3}
  .films.is-grid .film__sub{text-align:left;font-size:10.5px;white-space:normal}
  .films.is-grid .film__link{position:absolute;top:6px;right:6px;z-index:2;width:22px;height:22px;border:0;background:var(--bg);color:var(--fg)}
  .films.is-grid .film__link:hover{color:var(--acc)}
  .films.is-grid .film.is-picked{background:none;box-shadow:none}
  .films.is-grid .film.is-picked .film__poster{outline:2px solid var(--acc);outline-offset:2px}

  .empty{display:none;padding:18px 0;color:var(--dim)}
  .empty.is-on{display:block}
  .empty::before{content:"! ";color:var(--acc)}

  .foot{
    border-top:1px solid var(--line);margin-top:24px;padding:12px 0 30px;
    display:flex;justify-content:flex-end;color:var(--faint);font-size:11px;
  }
  .foot a{color:var(--dim)}

  /* film details */
  .modal{
    width:min(620px,calc(100% - 32px));max-height:calc(100% - 48px);overflow:auto;
    padding:0;border:1px solid var(--line2);background:var(--bg);color:var(--fg);
  }
  .modal::backdrop{background:rgba(0,0,0,.65)}
  .modal__body{display:grid;grid-template-columns:170px 1fr;gap:22px;padding:20px;position:relative}
  .modal__close{
    position:absolute;top:8px;right:8px;display:grid;place-items:center;width:26px;height:26px;
    border:1px solid var(--line2);color:var(--dim);font-size:15px;line-height:1;cursor:pointer;
  }
  .modal__close:hover{color:var(--fg);border-color:var(--acc-dim)}
  .modal__poster{display:block;width:100%;height:auto;border:1px solid var(--line);background:var(--sel)}
  .modal__poster[hidden]{display:none}
  .modal__title{margin:0 40px 0 0;font-size:16px;line-height:1.25;letter-spacing:.1em;text-transform:uppercase}
  .modal__uk{margin:4px 0 0;color:var(--faint);font-size:12px}
  .modal__meta{margin:12px 0 0;color:var(--dim);font-size:11.5px}
  .modal__meta b{color:var(--fg);font-weight:400}
  .modal__desc{margin:12px 0 0;color:var(--dim);font-size:12.5px;line-height:1.65}
  .modal__link{
    display:inline-block;margin-top:16px;padding-bottom:2px;color:var(--acc);font-size:11px;
    letter-spacing:.06em;text-transform:uppercase;border-bottom:1px solid var(--acc-dim);
  }
  .modal__link:hover{text-decoration:none;border-color:var(--acc)}
  @media(max-width:560px){
    .modal__body{grid-template-columns:1fr;gap:16px;padding:16px}
    .modal__poster{width:min(150px,45%)}
  }

  @media print{
    :root{--bg:#fff;--fg:#000;--dim:#444;--faint:#666;--acc:#000;--line:#bbb;--line2:#bbb;--sel:#fff;--pickbg:#fff}
    body{background:#fff;color:#000}
    .controls,.pick,.progress,.foot,.modal{display:none!important}
    .hero{border:0;padding:0 0 8px}
    .hero h1{font-size:16px}
    .film{border-color:#ccc;break-inside:avoid}
    .film__link{display:none}
    .film.is-watched .film__title{color:#000;text-decoration:line-through}
    .film.is-picked{background:none;box-shadow:none}
  }
</style>
</head>
<body>
<a class="skip" href="#list">Skip to the list</a>

<main id="top">
  <section class="hero">
    <div class="wrap hero__row">
      <div class="hero__lead">
        <h1>The <em>Watchlist</em></h1>
        <div class="pick">
          <button class="pick__btn" type="button" id="randomBtn"><i aria-hidden="true"></i> Pick a random unwatched film</button>
          <p class="pick__out" id="pickOut" aria-live="polite">Unwatched only — nothing picked yet.</p>
        </div>
      </div>
      <div class="progress" aria-label="Watch progress">
        <div class="progress__num"><b id="watchedCount">0</b> / <span id="totalCount">238</span></div>
        <div class="progress__bar" id="progressTrack" role="progressbar" aria-valuemin="0" aria-valuemax="238" aria-valuenow="0" aria-label="Films watched"><i id="progressBar"></i></div>
        <p class="progress__note"><b id="percent">0%</b> watched · <span id="remaining">238</span> left</p>
      </div>
    </div>
  </section>

  <div class="wrap">
    <section class="controls" aria-label="Checklist controls">
      <div class="seg" id="stateFilters" role="group" aria-label="Filter by watch state">
        <button class="btn" type="button" data-state="all" aria-pressed="true">All</button>
        <button class="btn" type="button" data-state="unwatched" aria-pressed="false">Unwatched</button>
        <button class="btn" type="button" data-state="watched" aria-pressed="false">Watched</button>
      </div>
      <span class="controls__sp"></span>
      <label class="search">
        <span class="skip">Search films</span>
        <input id="q" type="search" placeholder="Search title or year…" autocomplete="off" spellcheck="false">
        <kbd>/</kbd>
      </label>
      <select class="select" id="sortBy" aria-label="Sort films">
        <option value="default">Sort: as added</option>
        <option value="title">Title A–Z</option>
        <option value="year-desc">Year: newest</option>
        <option value="year-asc">Year: oldest</option>
        <option value="time-asc">Runtime: shortest</option>
        <option value="time-desc">Runtime: longest</option>
      </select>
      <button class="btn" type="button" id="viewBtn">view: list</button>
      <button class="btn" type="button" id="themeBtn">theme: dark</button>
    </section>

    <ol class="films" id="list"></ol>
    <div class="empty" id="empty">No films match that filter.</div>

    <footer class="foot">
      <a href="#top">Back to top ↑</a>
    </footer>
  </div>
</main>

<dialog class="modal" id="filmDialog" aria-labelledby="dialogTitle">
  <div class="modal__body">
    <button class="modal__close" type="button" id="dialogClose" aria-label="Close">×</button>
    <img class="modal__poster" id="dialogPoster" alt="" width="600" height="900">
    <div class="modal__info">
      <h2 class="modal__title" id="dialogTitle"></h2>
      <p class="modal__uk" id="dialogUk"></p>
      <p class="modal__meta" id="dialogMeta"></p>
      <p class="modal__desc" id="dialogDesc"></p>
      <a class="modal__link" id="dialogLink" href="#" target="_blank" rel="noopener noreferrer">View on Letterboxd ↗</a>
    </div>
  </div>
</dialog>

    "the-thin-red-line": {director: "Terrence Malick", desc: "The story of a group of men, an Army Rifle company called C-for-Charlie, who change, suffer, and ultimately make essential discoveries about themselves during the fierce World War II battle of Guadalcanal. It follows their journey, from the surprise of an unopposed landing, through the bloody and exhausting battles that follow, to the ultimate departure of those who survived.", poster: "https://a.ltrbxd.com/resized/film-poster/4/7/6/2/7/47627-the-thin-red-line-0-600-0-900-crop.jpg?v=996c013c41"},
    "gia": {director: "Michael Cristofer", desc: "Gia Carangi meteorically rises to modeling fame in the late 1970s but becomes overconsumed by persistent loneliness and drug addiction.", poster: "https://a.ltrbxd.com/resized/film-poster/4/3/0/1/8/43018-gia-0-600-0-900-crop.jpg?v=edd11ef917"},
    "nebraska": {director: "Alexander Payne", desc: "An aging, booze-addled father takes a trip from Montana to Nebraska with his estranged son in order to claim what he believes to be a million-dollar sweepstakes prize.", poster: "https://a.ltrbxd.com/resized/film-poster/1/0/0/9/2/0/100920-nebraska-0-600-0-900-crop.jpg?v=d40cd8dc17"},
    "beau-travail": {director: "Claire Denis", desc: "Foreign Legion officer Galoup recalls his once glorious life, training troops in the Gulf of Djibouti. His existence there was happy, strict and regimented, until the arrival of a promising young recruit, Sentain, plants the seeds of jealousy in Galoup's mind.", poster: "https://a.ltrbxd.com/resized/film-poster/4/2/9/4/2/42942-beau-travail-0-600-0-900-crop.jpg?v=a0e83a5f78"},
    "king-of-new-york": {director: "Abel Ferrara", desc: "A former drug lord returns from prison determined to wipe out all his competition and distribute the profits of his operations to New York's poor and lower classes in this stylish and ultra violent modern twist on Robin Hood.", poster: "https://a.ltrbxd.com/resized/film-poster/4/7/0/4/2/47042-king-of-new-york-0-600-0-900-crop.jpg?v=ef72bff72d"},
    "petite-maman": {director: "Céline Sciamma", desc: "After the death of her beloved grandmother, eight-year-old Nelly meets a strangely familiar girl her own age in the woods. Instantly forming a connection with this mysterious new friend, Nelly embarks on a fantastical journey of discovery which helps her come to terms with this newfound loss.", poster: "https://a.ltrbxd.com/resized/film-poster/6/6/9/7/4/4/669744-petite-maman-0-600-0-900-crop.jpg?v=c7cbed5a06"},
    "oslo-august-31st": {director: "Joachim Trier", desc: "A recovering drug addict is granted a day’s leave from rehab and returns to Oslo, where he reconnects with friends, faces the weight of his past, and struggles with uncertainty about his future. Over the course of one day, he drifts through encounters that reflect his longing for connection and his deep sense of alienation.", poster: "https://a.ltrbxd.com/resized/sm/upload/e6/m1/vn/g6/nitgCJ1g0ebztZHG0KwcojWlyPA-0-600-0-900-crop.jpg?v=d5466d278c"},
  };

  const KEY = "watchlist.films.v1";
  const list = document.getElementById("list");
  const empty = document.getElementById("empty");
  const q = document.getElementById("q");
  const sortBy = document.getElementById("sortBy");
  const filters = [...document.querySelectorAll("#stateFilters .btn")];

  let watched = new Set();
  try {
    const raw = JSON.parse(localStorage.getItem(KEY) || "[]");
    const valid = new Set(FILMS.map(f => f.id));
    watched = new Set(raw.filter(id => valid.has(id)));
  } catch (_) { watched = new Set(); }

  let state = "all";
  let term = "";
  let sort = "default";
  let view = "list";
  let picked = null;

  function save(){
    try { localStorage.setItem(KEY, JSON.stringify([...watched])); } catch (_) {}
  }

  function runtime(m){
    if(!m) return "--h:--m:--s";
    const h = Math.floor(m / 60), r = m % 60;
    return String(h).padStart(2, "0") + "h:" + String(r).padStart(2, "0") + "m:00s";
  }

  function ordered(){
    const arr = FILMS.slice();
    const byTitle = (a, b) => a.title.localeCompare(b.title);
    if(sort === "title") arr.sort(byTitle);
    else if(sort === "year-desc") arr.sort((a, b) => b.year - a.year || byTitle(a, b));
    else if(sort === "year-asc") arr.sort((a, b) => a.year - b.year || byTitle(a, b));
    else if(sort === "time-asc") arr.sort((a, b) => (a.min || 1e4) - (b.min || 1e4) || byTitle(a, b));
    else if(sort === "time-desc") arr.sort((a, b) => (b.min || -1) - (a.min || -1) || byTitle(a, b));
    return arr;
  }

  function render(){
    const grid = view === "grid";
    list.classList.toggle("is-grid", grid);
    list.innerHTML = ordered().map((f, i) => {
      const d = DETAILS[f.id] || {};
      const name = `<span class="film__title">${esc(f.title)}</span> ` +
        (f.uk ? `<span class="film__uk">${esc(f.uk)}</span>` : "");
      const poster = grid && d.poster
        ? `<span class="film__poster"><img src="${esc(d.poster.replace("-0-600-0-900-crop", "-0-300-0-450-crop"))}" alt="" loading="lazy" decoding="async" referrerpolicy="no-referrer"></span>`
        : "";
      const nameTag = grid
        ? `<span class="film__name">${name}</span>`
        : `<button class="film__open" type="button" data-id="${f.id}" aria-haspopup="dialog">${name}</button>`;
      return `
      <li class="film" id="row-${f.id}" data-id="${f.id}" data-search="${(f.title + " " + (f.uk || "") + " " + f.year).toLowerCase()}">
        <input class="film__check" type="checkbox" id="film-${i}" data-id="${f.id}" aria-label="Mark ${esc(f.title)} watched">
        ${poster}
        <label class="film__boxlabel" for="film-${i}"><span class="film__box" aria-hidden="true"></span></label>
        <div class="film__main">
          ${nameTag}
          <span class="film__sub">${f.year} <i>·</i> <b>${runtime(f.min)}</b></span>
        </div>
        <a class="film__link" href="${esc(f.url)}" target="_blank" rel="noopener noreferrer" aria-label="Open ${esc(f.title)}">↗</a>
      </li>`;
    }).join("");
    sync();
    if(picked){
      const row = list.querySelector('.film[data-id="' + picked.id + '"]');
      if(row) row.classList.add("is-picked");
    }
  }

  function esc(s){
    return String(s).replace(/[&<>"']/g, c => ({ "&":"&amp;", "<":"&lt;", ">":"&gt;", '"':"&quot;", "'":"&#39;" }[c]));
  }

  function sync(){
    const total = FILMS.length;
    const n = watched.size;
    document.getElementById("totalCount").textContent = total;
    document.getElementById("watchedCount").textContent = n;
    const pct = total ? Math.round((n / total) * 100) : 0;
    document.getElementById("percent").textContent = pct + "%";
    document.getElementById("remaining").textContent = total - n;
    document.getElementById("progressBar").style.width = pct + "%";
    const track = document.getElementById("progressTrack");
    track.setAttribute("aria-valuenow", String(n));
    track.setAttribute("aria-valuemax", String(total));

    list.querySelectorAll(".film").forEach(el => {
      const isWatched = watched.has(el.dataset.id);
      el.classList.toggle("is-watched", isWatched);
      const cb = el.querySelector(".film__check");
      if(cb) cb.checked = isWatched;
    });
    apply();
  }

  function apply(){
    let visible = 0;
    list.querySelectorAll(".film").forEach(el => {
      const isWatched = watched.has(el.dataset.id);
      const stateOK = state === "all" || (state === "watched" ? isWatched : !isWatched);
      const termOK = !term || el.dataset.search.includes(term);
      el.hidden = !(stateOK && termOK);
      if(!el.hidden) visible++;
    });
    empty.classList.toggle("is-on", visible === 0);
  }

  list.addEventListener("change", e => {
    const cb = e.target.closest(".film__check");
    if(!cb) return;
    if(cb.checked) watched.add(cb.dataset.id); else watched.delete(cb.dataset.id);
    save(); sync();
  });

  /* film details */
  const dialog = document.getElementById("filmDialog");
  const dialogPoster = document.getElementById("dialogPoster");
  const dialogTitle = document.getElementById("dialogTitle");
  const dialogUk = document.getElementById("dialogUk");
  const dialogMeta = document.getElementById("dialogMeta");
  const dialogDesc = document.getElementById("dialogDesc");
  const dialogLink = document.getElementById("dialogLink");

  list.addEventListener("click", e => {
    const open = e.target.closest(".film__open");
    if(!open) return;
    const film = FILMS.find(f => f.id === open.dataset.id);
    if(!film) return;
    const d = DETAILS[film.id] || {};
    dialogTitle.textContent = film.title;
    dialogUk.textContent = film.uk || "";
    dialogUk.hidden = !film.uk;
    dialogMeta.innerHTML = film.year + " · " + runtime(film.min) +
      (d.director ? " · Directed by <b>" + esc(d.director) + "</b>" : "");
    dialogDesc.textContent = d.desc || "";
    dialogDesc.hidden = !d.desc;
    if(d.poster){
      dialogPoster.src = d.poster;
      dialogPoster.alt = "Poster for " + film.title;
      dialogPoster.hidden = false;
    } else {
      dialogPoster.removeAttribute("src");
      dialogPoster.alt = "";
      dialogPoster.hidden = true;
    }
    dialogLink.href = film.url;
    dialog.showModal();
  });

  document.getElementById("dialogClose").addEventListener("click", () => dialog.close());
  dialog.addEventListener("click", e => { if(e.target === dialog) dialog.close(); });

  filters.forEach(btn => btn.addEventListener("click", () => {
    filters.forEach(b => b.setAttribute("aria-pressed", String(b === btn)));
    state = btn.dataset.state;
    apply();
  }));

  sortBy.addEventListener("change", () => {
    sort = sortBy.value;
    render();
  });

  let timer;
  q.addEventListener("input", () => {
    clearTimeout(timer);
    timer = setTimeout(() => { term = q.value.trim().toLowerCase(); apply(); }, 70);
  });
  q.addEventListener("keydown", e => {
    if(e.key === "Escape"){ q.value = ""; term = ""; apply(); q.blur(); }
  });
  document.addEventListener("keydown", e => {
    if(e.key === "/" && document.activeElement !== q && !/^(INPUT|TEXTAREA|SELECT)$/.test(document.activeElement.tagName)){
      e.preventDefault(); q.focus();
    }
  });

  /* theme */
  const themeBtn = document.getElementById("themeBtn");
  const TKEY = "watchlist.theme.v1";
  function setTheme(t){
    document.documentElement.dataset.theme = t;
    themeBtn.textContent = "theme: " + t;
    try { localStorage.setItem(TKEY, t); } catch (_) {}
  }
  let theme = "dark";
  try {
    theme = localStorage.getItem(TKEY) ||
      (window.matchMedia("(prefers-color-scheme: light)").matches ? "light" : "dark");
  } catch (_) {}
  setTheme(theme);
  themeBtn.addEventListener("click", () => setTheme(theme = theme === "dark" ? "light" : "dark"));

  /* view: list / grid */
  const viewBtn = document.getElementById("viewBtn");
  const VKEY = "watchlist.view.v1";
  try {
    const saved = localStorage.getItem(VKEY);
    if(saved === "grid" || saved === "list") view = saved;
  } catch (_) {}
  function setView(v){
    view = v === "grid" ? "grid" : "list";
    viewBtn.textContent = "view: " + view;
    try { localStorage.setItem(VKEY, view); } catch (_) {}
    render();
  }
  viewBtn.addEventListener("click", () => setView(view === "grid" ? "list" : "grid"));

  /* randomizer — unwatched only */
  const randomBtn = document.getElementById("randomBtn");
  const pickOut = document.getElementById("pickOut");

  randomBtn.addEventListener("click", () => {
    let pool = FILMS.filter(f => !watched.has(f.id));
    if(pool.length > 1 && picked) pool = pool.filter(f => f.id !== picked.id);
    if(!pool.length){
      pickOut.textContent = watched.size === FILMS.length
        ? "Everything on the list is watched."
        : "Nothing left to pick.";
      return;
    }
    picked = pool[Math.floor(Math.random() * pool.length)];

    list.querySelectorAll(".film.is-picked").forEach(el => el.classList.remove("is-picked"));
    const row = list.querySelector('.film[data-id="' + picked.id + '"]');
    if(row) row.classList.add("is-picked");
    pickOut.innerHTML = 'Tonight: <a class="pick__link" href="#row-' + picked.id + '">' + esc(picked.title) + "</a> (" + picked.year + ")";
  });

  pickOut.addEventListener("click", e => {
    const link = e.target.closest(".pick__link");
    if(!link || !picked) return;
    const row = list.querySelector('.film[data-id="' + picked.id + '"]');
    if(!row) return;
    e.preventDefault();
    if(row.hidden){
      state = "all";
      filters.forEach(b => b.setAttribute("aria-pressed", String(b.dataset.state === "all")));
      q.value = ""; term = "";
      apply();
    }
    row.classList.add("is-picked");
    row.scrollIntoView({ block: "center", behavior: "smooth" });
  });

  setView(view);
})();
</script>
</body>
</html>
